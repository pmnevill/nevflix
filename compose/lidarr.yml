# No secrets. ZimaOS app "lidarr". KEEP "Allow Fingerprinting" ON in the UI (see GOTCHAS.md).
# Nested download mounts: /data/downloads (parent), /data/downloads/slskd, /data/downloads/deluge.
name: lidarr
services:
    lidarr:
        container_name: lidarr
        deploy:
            resources:
                limits: { cpus: "1.00", memory: "4294967296" }
                reservations: { cpus: "0.00", memory: "67108864" }
        environment: { PGID: "1001", PUID: "1000", TZ: America/Chicago }
        image: linuxserver/lidarr:3.1.0
        network_mode: bridge
        ports:
            - { target: 8686, published: "8686", protocol: tcp }
        restart: unless-stopped
        volumes:
            - { type: bind, source: /media/ssd-storage/docker/arrs/lidarr, target: /config }
            - { type: bind, source: /media/ssd-storage/docker/media/music, target: /data/music }
            - { type: bind, source: /media/ssd-storage/docker/downloads, target: /data/downloads }
            - { type: bind, source: /media/ssd-storage/docker/backup/lidarr, target: /backup }
            - { type: bind, source: /media/ssd-storage/docker/downloads/slskd, target: /data/downloads/slskd }
            - { type: bind, source: /media/ssd-storage/library/downloads, target: /data/downloads/deluge }
networks: { default: { name: lidarr_default } }
x-casaos: { main: lidarr, port_map: "8686", scheme: http, store_app_id: lidarr, title: { custom: Lidarr } }
