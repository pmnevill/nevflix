# No secrets. ZimaOS app "sonarr".
# NOTE: TV library is on /media/ZimaOS-HD (=/DATA), downloads on the other drive =>
# cross-filesystem => Sonarr COPIES (cannot hardlink). Mitigate with "Remove Completed". See GOTCHAS.md.
name: sonarr
services:
    sonarr:
        container_name: sonarr
        deploy:
            resources:
                limits: { cpus: "1.00", memory: "4294967296" }
                reservations: { cpus: "0.00", memory: "268435456" }
        environment: { PGID: "1001", PUID: "1000", TZ: America/Chicago }
        image: linuxserver/sonarr:4.0.19
        network_mode: bridge
        ports:
            - { target: 8989, published: "8989", protocol: tcp }
        restart: unless-stopped
        volumes:
            - { type: bind, source: /media/ssd-storage/docker/arrs/sonarr, target: /config }
            - { type: bind, source: /media/ZimaOS-HD/media/tvshows, target: /data/tvshows }   # NVMe/DATA (different fs)
            - { type: bind, source: /media/ssd-storage/library/downloads, target: /data/downloads }
            - { type: bind, source: /media/ssd-storage/docker/backup/sonarr, target: /backup }
networks: { default: { name: sonarr_default } }
x-casaos: { main: sonarr, port_map: "8989", scheme: http, store_app_id: sonarr, title: { custom: Sonarr } }
