# No secrets. ZimaOS app "jellyfin". Reads libraries only (doesn't move/import).
name: jellyfin
services:
    jellyfin:
        container_name: jellyfin
        deploy:
            resources:
                limits: { cpus: "1.00", memory: "4294967296" }
                reservations: { cpus: "0.00", memory: "268435456" }
        devices:                       # Intel QuickSync / VAAPI passthrough for HW transcode
            - /dev/dri:/dev/dri
            - /dev/vcsm:/dev/vcsm
            - /dev/vchiq:/dev/vchiq
            - /dev/video10:/dev/video10
            - /dev/video11:/dev/video11
            - /dev/video12:/dev/video12
        environment: { PGID: "1001", PUID: "1000", TZ: America/Chicago }
        image: linuxserver/jellyfin:10.11.10
        network_mode: bridge
        ports:
            - { target: 8096, published: "8097", protocol: tcp }   # web (remapped 8096->8097)
            - { target: 8920, published: "8921", protocol: tcp }   # https
            - { target: 7359, published: "7359", protocol: tcp }   # discovery
            - { target: 1900, published: "1901", protocol: tcp }   # dlna (remapped)
        restart: unless-stopped
        volumes:
            - { type: bind, source: /media/ssd-storage/docker/jellyfin, target: /config }
            - { type: bind, source: /media/ssd-storage/library/movies, target: /data/movies }
            - { type: bind, source: /opt/vc/lib, target: /opt/vc/lib }
            - { type: bind, source: /media/ZimaOS-HD/media/tvshows, target: /data/tvshows }
            - { type: bind, source: /media/ssd-storage/docker/resilio-sync/data, target: /data/star-wars-despecialized }
networks: { default: { name: jellyfin_default } }
x-casaos: { main: jellyfin, port_map: "8097", scheme: http, store_app_id: jellyfin, title: { custom: Jellyfin } }
