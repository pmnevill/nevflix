# SANITIZED for the repo. Real secrets replaced with __PLACEHOLDER__ values.
# The real file lives at (host) /media/ssd-storage/docker/arrs/soularr/config.ini
# Restore real values from your .env / password manager. See SETUP.md.

[Lidarr]
api_key = __LIDARR_API_KEY__
host_url = http://__HOST_IP__:8686
#This is the downloads path FROM THE POINT OF VIEW OF LIDARR
download_dir = /data/downloads/slskd

[Slskd]
api_key = __SLSKD_API_KEY__
host_url = http://__HOST_IP__:5030
#This is the downloads path FROM THE POINT OF VIEW OF SLSKD
download_dir = /downloads
delete_searches = False
stalled_timeout = 3600

[Release Settings]
use_most_common_tracknum = True
allow_multi_disc = True
#accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
allowed_filetypes = flac,mp3
ignored_users = User1,User2,Fred,Bob,SGAE
search_for_tracks = False
# album_prepend_artist / track_prepend_artist = critical to avoid wrong-artist grabs (see GOTCHAS.md)
album_prepend_artist = True
track_prepend_artist = True
search_type = incrementing_page
number_of_albums_to_grab = 10
remove_wanted_on_failure = False
title_blacklist = BlacklistWord1,blacklistword2
# minimum_filename_match_ratio = rejects loose/wrong-content matches (see GOTCHAS.md)
minimum_filename_match_ratio = 0.5

[Download Settings]
rename_download_folders=True

[Logging]
level = INFO
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
datefmt = %Y-%m-%dT%H:%M:%S%z
